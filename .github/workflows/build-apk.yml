name: Build Garanzia APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -type f -print -exec cp {} artifact/garanzia-release-unsigned.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garanzia-release-unsigned
          path: artifact/garanzia-release-unsigned.apk
          if-no-files-found: error
