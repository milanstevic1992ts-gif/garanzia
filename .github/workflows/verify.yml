name: Verify Garanzia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-garanzia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-list.txt

          PLATFORM="$(awk '/platforms;android-37/ {print $1; exit}' /tmp/sdk-list.txt)"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="$(awk '/platforms;android-CinnamonBun/ {print $1; exit}' /tmp/sdk-list.txt)"
          fi

          BUILD_TOOLS="$(awk '/build-tools;37\./ {print $1}' /tmp/sdk-list.txt | sort -V | tail -1)"

          test -n "$PLATFORM"
          test -n "$BUILD_TOOLS"

          "$SDKMANAGER" --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload Italian OCR benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: italian-ocr-benchmark
          path: app/build/reports/ocr-benchmark
          if-no-files-found: error
          retention-days: 30

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare unsigned release artifact
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Garanzia-v1.0.0-UNSIGNED.apk
          sha256sum dist/Garanzia-v1.0.0-UNSIGNED.apk             > dist/Garanzia-v1.0.0-UNSIGNED.apk.sha256

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: garanzia-v1.0.0-unsigned
          path: |
            dist/Garanzia-v1.0.0-UNSIGNED.apk
            dist/Garanzia-v1.0.0-UNSIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Android signing verification tools
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BUILD_TOOLS_DIR="$(dirname "$APKSIGNER")"
          mkdir -p dist/android-signing-tools/lib dist/android-signing-tools/lib64
          cp "$BUILD_TOOLS_DIR/apksigner" dist/android-signing-tools/
          cp "$BUILD_TOOLS_DIR/zipalign" dist/android-signing-tools/
          cp "$BUILD_TOOLS_DIR/aapt2" dist/android-signing-tools/
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" dist/android-signing-tools/lib/
          cp "$BUILD_TOOLS_DIR/lib64/libc++.so" dist/android-signing-tools/lib64/
          chmod +x dist/android-signing-tools/apksigner
          chmod +x dist/android-signing-tools/zipalign
          chmod +x dist/android-signing-tools/aapt2

      - name: Upload Android signing verification tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-linux
          path: dist/android-signing-tools
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v3
          path: app/schemas
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Room schemas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "garanzia-ci"
          git config user.email "garanzia-ci@users.noreply.github.com"
          git add app/schemas

          if git diff --cached --quiet; then
            echo "Room schema already committed."
            exit 0
          fi

          git commit -m "chore(data): sync Room schemas [skip ci]"
          git push origin HEAD:main

  migration-device-test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-list.txt

          PLATFORM="$(awk '/platforms;android-37/ {print $1; exit}' /tmp/sdk-list.txt)"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="$(awk '/platforms;android-CinnamonBun/ {print $1; exit}' /tmp/sdk-list.txt)"
          fi

          BUILD_TOOLS="$(awk '/build-tools;37\./ {print $1}' /tmp/sdk-list.txt | sort -V | tail -1)"

          test -n "$PLATFORM"
          test -n "$BUILD_TOOLS"

          "$SDKMANAGER" --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room migrations on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
