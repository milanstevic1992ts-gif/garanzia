name: Verify Garanzia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-garanzia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-list.txt

          PLATFORM="$(awk '/platforms;android-37/ {print $1; exit}' /tmp/sdk-list.txt)"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="$(awk '/platforms;android-CinnamonBun/ {print $1; exit}' /tmp/sdk-list.txt)"
          fi

          BUILD_TOOLS="$(awk '/build-tools;37\./ {print $1}' /tmp/sdk-list.txt | sort -V | tail -1)"

          test -n "$PLATFORM"
          test -n "$BUILD_TOOLS"

          "$SDKMANAGER" --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v2
          path: app/schemas
          if-no-files-found: error
          retention-days: 7

  migration-device-test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-list.txt

          PLATFORM="$(awk '/platforms;android-37/ {print $1; exit}' /tmp/sdk-list.txt)"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="$(awk '/platforms;android-CinnamonBun/ {print $1; exit}' /tmp/sdk-list.txt)"
          fi

          BUILD_TOOLS="$(awk '/build-tools;37\./ {print $1}' /tmp/sdk-list.txt | sort -V | tail -1)"

          test -n "$PLATFORM"
          test -n "$BUILD_TOOLS"

          "$SDKMANAGER" --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Migration v1 to v2 on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
